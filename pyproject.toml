[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereviewer"
version = "0.1.0"
description = "Code Review Agent skeleton"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "requests>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
